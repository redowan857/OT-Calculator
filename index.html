<!DOCTYPE html>
<html>
<head>
    <title>OT Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>OT Calculator</h2>

<label>Basic Salary</label>
<input id="salary" type="number" placeholder="Enter Salary">


<label>Monthly Working Hour</label>
<input id="workingHour" type="number" value="188.31">


<label>OT Start Time</label>
<input id="startTime" type="time">


<label>OT End Time</label>
<input id="endTime" type="time">


<button onclick="calculateOT()">Calculate</button>


<div class="result">

<p>OT Hour:
<span id="otHour">0</span>
</p>


<p>OT Rate:
<span id="otRate">0</span> টাকা
</p>


<p>Total OT Amount:
<span id="total">0</span> টাকা
</p>

</div>


</div>


<script src="script.js"></script>

</body>
</html>
